<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">Código Morse</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Input -->
                        <div class="input-group mb-4">
                            <span class="input-group-text bg-secondary text-white border-secondary">Expresión:</span>
                            <input type="text" id="texto" class="form-control border-secondary" placeholder="Escribe aquí...">
                            
                            <!-- Select para el tipo de conversión -->
                            <select id="tipo-conversion" class="form-select border-secondary" style="max-width: 180px;">
                                <option value="texto-morse">Texto a Morse</option>
                                <option value="morse-texto">Morse a Texto</option>
                            </select>

                            <button class="btn btn-primary px-4" id="btn-procesar">Generar Traducción</button>
                            <button class="btn btn-danger px-4" id="btn-limpiar">Limpiar</button>
                        </div>

                        <!-- Salida -->
                        <div class="row">
                            <div class="col-12">
                                <label for="resultado" class="form-label fw-bold">Resultado:</label>
                                <textarea id="resultado" class="form-control" rows="4" readonly></textarea>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="bundle.js"></script>
</body>
</html>
